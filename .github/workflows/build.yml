name: Build & Verify (iOS + Android)

on:
  push:
    branches: [main, ios-pathB]
  workflow_dispatch:

jobs:
  ios-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders (official)
        run: |
          cp -r ios /tmp/ios_custom
          flutter create --org com.tajership --project-name tajership --platforms=ios .
          cp -rf /tmp/ios_custom/* ios/
          rm -rf test
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Launcher icons
        run: dart run flutter_launcher_icons || true
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Report
        run: echo "iOS build compiled successfully (unsigned)"

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders (official)
        run: |
          cp -r android /tmp/android_custom
          flutter create --org com.tajership --project-name tajership --platforms=android .
          cp -rf /tmp/android_custom/* android/
          rm -rf test
      - name: Pub get
        run: flutter pub get
      - name: Launcher icons
        run: dart run flutter_launcher_icons || true
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TajerShip-APK-pathB
          path: build/app/outputs/flutter-apk/app-release.apk
