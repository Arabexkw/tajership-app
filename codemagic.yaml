# ============================================================
# TajerShip — Codemagic CI/CD (iOS + Android)
# المسار B: غلاف أصلي + ميزات أصلية (Push / Share / Session)
# ============================================================

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tajership_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - tajership_signing
        - tajership_firebase
      vars:
        APP_STORE_APPLE_ID: 6808005611
        BUNDLE_ID: com.tajership.app
        APPLE_TEAM_ID: 4JK4TN57MH
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    scripts:
      - name: Generate platform folders (official)
        script: |
          cp -r ios /tmp/ios_custom 2>/dev/null || true
          cp -r android /tmp/android_custom 2>/dev/null || true
          flutter create --org com.tajership --project-name tajership --platforms=ios,android .
          [ -d /tmp/ios_custom ] && cp -rf /tmp/ios_custom/* ios/
          [ -d /tmp/android_custom ] && cp -rf /tmp/android_custom/* android/
          rm -rf test
      - name: Force Bundle ID = com.tajership.app
        script: |
          # flutter create يولّد com.tajership.tajership — الـ profile لـ com.tajership.app
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.tajership\.tajership\.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID.RunnerTests;/g" "$PBX"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.tajership\.tajership;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" "$PBX"
          echo "Bundle IDs now:"; grep "PRODUCT_BUNDLE_IDENTIFIER" "$PBX" | sort -u
      - name: Enable Push entitlement (aps-environment)
        script: |
          PBX=ios/Runner.xcodeproj/project.pbxproj
          # ربط ملف entitlements بكل إعدادات target Runner (يُدرج بعد PRODUCT_BUNDLE_IDENTIFIER لكل configuration)
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|g" "$PBX"
          echo "entitlement refs:"; grep -c "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" "$PBX"
          cat ios/Runner/Runner.entitlements
      - name: Firebase config (optional)
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Firebase iOS config written"
            P=ios/Runner/GoogleService-Info.plist
            echo "FB_API_KEY=$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' $P)" >> $CM_ENV
            echo "FB_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' $P)" >> $CM_ENV
            echo "FB_SENDER_ID=$(/usr/libexec/PlistBuddy -c 'Print :GCM_SENDER_ID' $P)" >> $CM_ENV
            echo "FB_PROJECT_ID=$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' $P)" >> $CM_ENV
            echo "Firebase options exported to build env"
          else
            echo "No Firebase config - building without Push"
          fi
      - name: Get packages
        script: |
          flutter pub get
      - name: Launcher icons
        script: |
          dart run flutter_launcher_icons || true
      - name: Flutter build (no codesign)
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "FB lens: key=${#FB_API_KEY} app=${#FB_APP_ID} sender=${#FB_SENDER_ID} proj=${#FB_PROJECT_ID}"
          flutter build ios --release --no-codesign --build-name=1.0.1 --build-number=$BUILD_NUMBER \
            --dart-define=FB_API_KEY="${FB_API_KEY:-}" \
            --dart-define=FB_APP_ID="${FB_APP_ID:-}" \
            --dart-define=FB_SENDER_ID="${FB_SENDER_ID:-}" \
            --dart-define=FB_PROJECT_ID="${FB_PROJECT_ID:-}"
      - name: Fetch or create signing files (cert + profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Xcode archive + export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Release (AAB)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - tajership_keystore
    scripts:
      - name: Generate platform folders (official)
        script: |
          cp -r android /tmp/android_custom 2>/dev/null || true
          flutter create --org com.tajership --project-name tajership --platforms=android .
          [ -d /tmp/android_custom ] && cp -rf /tmp/android_custom/* android/
          rm -rf test
          sed -i '' 's/applicationId = "com\.tajership\.tajership"/applicationId = "com.tajership.app"/' android/app/build.gradle.kts 2>/dev/null || true
      - name: Set up keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
          cat > android/key.properties <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          KEYEOF
      - name: Get packages
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release --build-name=1.0.1 --build-number=2
    artifacts:
      - build/app/outputs/bundle/release/*.aab
